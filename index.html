<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card com Bootstrap e JavaScript</title>

    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Aprendendo Bootstrap e JavaScript
        </h1>

        <!-- Card do Bootstrap -->
        <div id="cardCurso" class="card mx-auto bg-white" style="max-width: 400px;">

            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80"
                 class="card-img-top"
                 alt="Pessoa utilizando computador">

            <div class="card-body">

                <h5 class="card-title">
                    Curso de Desenvolvimento Web
                </h5>

                <p id="descricao" class="card-text">
                    Aprenda HTML, CSS, Bootstrap e JavaScript.
                </p>

                <button id="btnAlterar" class="btn btn-primary">
                    Ver conteúdo
                </button>

            </div>
        </div>

    </div>

    <!-- JavaScript do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nosso JavaScript -->
    <script>

        // Capturando os elementos HTML
        const botao = document.getElementById("btnAlterar");
        const card = document.getElementById("cardCurso");
        const descricao = document.getElementById("descricao");

        // Controla o estado do card
        let ativado = false;

        // Adicionando evento de clique
        botao.addEventListener("click", function() {

            ativado = !ativado;

            if (ativado) {

                descricao.textContent =
                    "Parabéns! Você está explorando o poder do Bootstrap com JavaScript!";

                card.classList.replace("bg-white", "bg-primary");
                card.classList.add("text-white");

                botao.textContent = "Voltar";

            } else {

                descricao.textContent =
                    "Aprenda HTML, CSS, Bootstrap e JavaScript.";

                card.classList.replace("bg-primary", "bg-white");
                card.classList.remove("text-white");

                botao.textContent = "Ver conteúdo";

            }

        });

    </script>

</body>
</html>
